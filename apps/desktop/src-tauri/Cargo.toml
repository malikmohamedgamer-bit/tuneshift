[package]
name = "tuneshift"
version = "0.1.0"
description = "Tuneshift — personal music app with a live Sound Lab"
authors = ["Tuneshift"]
edition = "2021"
rust-version = "1.80"
license = "MIT"

[lib]
name = "tuneshift_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
tauri = { version = "=2.12.7", features = ["tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-single-instance = { version = "=2.5.5", features = ["deep-link"] }
tauri-plugin-window-state = "=2.5.0"
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-deep-link = "=2.6.3"
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-opener = "=2.7.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
walkdir = "=2.5.0"
discord-rich-presence = "=1.1.0"

# Same `windows`/`webview2-com` versions Tauri 2.12.7 uses, so the WebView2 COM types match.
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Media_Control", "Foundation", "Foundation_Collections", "Storage_Streams"] }
webview2-com = "=0.39.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
