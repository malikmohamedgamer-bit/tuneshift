<!doctype html>
<html lang="en" data-theme-scheme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0b14" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="Tuneshift — your music with a live Sound Lab: sped up, slowed + reverb, bass boost, 8D and a 10-band EQ."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tuneshift" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Tuneshift</title>
    <style>
      html,
      body {
        background: #0d0b14;
        color: #f4f1fa;
        margin: 0;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        font:
          600 15px system-ui,
          sans-serif;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <script>
      // Safe-theme escape hatch: remember if Shift is held while the app boots.
      (function () {
        var on = function (e) {
          if (e.key === 'Shift') window.__tsShift = true;
        };
        window.addEventListener('keydown', on);
        setTimeout(function () {
          window.removeEventListener('keydown', on);
        }, 1500);
      })();
    </script>
    <div id="root"><div id="boot">Loading Tuneshift…</div></div>
    <noscript>Tuneshift needs JavaScript to run.</noscript>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
