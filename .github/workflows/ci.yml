name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck · lint · unit · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm e2e
      - name: Build extension
        if: hashFiles('apps/extension/manifest.json') != ''
        run: pnpm ext:build
      - uses: actions/upload-artifact@v4
        if: success() && hashFiles('tuneshift-boost-extension.zip') != ''
        with:
          name: tuneshift-boost-extension
          path: tuneshift-boost-extension.zip
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  desktop-crate:
    name: Desktop crate (cargo check · clippy · test)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Stub frontend dir for tauri::generate_context!
        shell: bash
        run: mkdir -p apps/web/dist-desktop && echo '<!doctype html><title>ci</title>' > apps/web/dist-desktop/index.html
      - name: cargo check
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked --all-targets
      - name: cargo clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked
