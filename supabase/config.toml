# Minimal Supabase CLI config for local development (`supabase start`, `supabase db reset`).
project_id = "tuneshift"

[api]
enabled = true
port = 54321

[db]
port = 54322
major_version = 17

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "2MiB"

[auth]
enabled = true
site_url = "http://localhost:5173/"
additional_redirect_urls = [
  "https://malikmohamedgamer-bit.github.io/tuneshift/",
  "https://malikmohamedgamer-bit.github.io/tuneshift/**",
  "http://localhost:5173/**",
  "http://127.0.0.1:5173/**",
  "tuneshift://auth",
]
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
